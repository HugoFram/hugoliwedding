# Port 2585 provides a LAN preview while DNS/HTTPS are being configured.
Listen 2585
<VirtualHost *:80 *:2585>
    ServerName hugoli-mariage-test.frammery.com
    DocumentRoot /var/www/hugoli/test/public
    <Directory /var/www/hugoli/test/public>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        Require all granted
        AddType text/javascript .mjs
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    Alias /.well-known/acme-challenge/ /var/www/hugoli/acme/.well-known/acme-challenge/
    <Directory /var/www/hugoli/acme/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/hugoli-test-error.log
    CustomLog ${APACHE_LOG_DIR}/hugoli-test-access.log combined
</VirtualHost>
