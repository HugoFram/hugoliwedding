# Sort after the existing test TLS host to preserve its default-host behavior.
<VirtualHost *:443>
    ServerName hugoli-mariage.frammery.com
    DocumentRoot /var/www/hugoli/production/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hugoli-mariage.frammery.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hugoli-mariage.frammery.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    <Directory /var/www/hugoli/production/public>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        SetHandler default-handler
        Require all granted
        AddType text/javascript .mjs
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/hugoli-production-error.log
    CustomLog ${APACHE_LOG_DIR}/hugoli-production-access.log combined
</VirtualHost>
