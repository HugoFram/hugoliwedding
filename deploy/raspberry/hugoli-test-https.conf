# Existing applications on their dedicated ports keep their own configuration.
<VirtualHost *:443>
    ServerName hugoli-mariage-test.frammery.com
    DocumentRoot /var/www/hugoli/test/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hugoli-mariage-test.frammery.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hugoli-mariage-test.frammery.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    <Directory /var/www/hugoli/test/public>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        SetHandler default-handler
        Require all granted
        AddType text/javascript .mjs
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/hugoli-test-error.log
    CustomLog ${APACHE_LOG_DIR}/hugoli-test-access.log combined
</VirtualHost>
