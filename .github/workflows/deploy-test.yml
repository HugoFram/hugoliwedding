name: Déployer en test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: test
      url: https://hugoli-mariage-test.frammery.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s deploy/raspberry -p 'test_*.py'
      - run: npm run build
      - name: Préparer la version
        run: node scripts/release.mjs artifacts/release
      - name: Conserver les fichiers de cette version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hugoli-site-${{ github.run_attempt }}
          path: artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publier la version que récupère le Raspberry Pi
        run: node scripts/publish-raspberry.mjs artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attendre et vérifier le site de test en HTTPS
        run: node scripts/verify-deployment.mjs test artifacts/release
        env:
          VERIFY_WAIT_SECONDS: '180'
