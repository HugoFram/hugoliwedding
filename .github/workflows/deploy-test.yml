name: Déployer en test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: test
      url: https://hugoli-mariage-test.frammery.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Préparer la version
        run: node scripts/release.mjs artifacts/release
      - name: Vérifier la configuration SFTP
        run: node scripts/deploy-sftp.mjs test --check-config
        env:
          STRATO_SFTP_HOST: ${{ vars.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ vars.STRATO_SFTP_USER }}
          STRATO_SSH_KNOWN_HOSTS: ${{ vars.STRATO_SSH_KNOWN_HOSTS }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      - name: Installer le client SFTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sshpass
      - name: Déployer dans le dossier de test
        run: node scripts/deploy-sftp.mjs test artifacts/release
        env:
          STRATO_SFTP_HOST: ${{ vars.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ vars.STRATO_SFTP_USER }}
          STRATO_SSH_KNOWN_HOSTS: ${{ vars.STRATO_SSH_KNOWN_HOSTS }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      - name: Vérifier le site de test en HTTPS
        run: node scripts/verify-deployment.mjs test artifacts/release
      - name: Conserver les fichiers validés pour la production
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hugoli-site-${{ github.run_attempt }}
          path: artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Résumé
        env:
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          echo '### Version disponible sur le site de test' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://hugoli-mariage-test.frammery.com/' >> "$GITHUB_STEP_SUMMARY"
          echo "Après validation, lancer **Publier en production** avec le numéro **$TEST_RUN_ID**." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
